server {
    server_name tixkita.id www.tixkita.id;
    root /var/www/tixkita/public;

    # === SECURITY HEADERS ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://app.sandbox.midtrans.com https://app.midtrans.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https: http:; connect-src 'self' https://app.sandbox.midtrans.com https://app.midtrans.com; frame-src https://app.sandbox.midtrans.com https://app.midtrans.com;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # === SEMBUNYIKAN VERSI NGINX ===
    server_tokens off;

    index index.php index.html index.htm;
    charset utf-8;

    # === BLOKIR FILE SENSITIF ===
    location ~ /\.env { deny all; return 404; }
    location ~ /\.git { deny all; return 404; }
    location ~ /\.htaccess { deny all; return 404; }
    location ~ \.bak$ { deny all; return 404; }
    location ~ \.sql$ { deny all; return 404; }
    location ~ \.log$ { deny all; return 404; }

    # === BLOKIR PATH PROBING (scanner/bot) ===
    location = /wp-admin { return 404; }
    location = /phpmyadmin { return 404; }
    location = /backup { return 404; }
    location = /config { return 404; }
    location = /graphql { return 404; }
    location = /graphiql { return 404; }
    location = /swagger { return 404; }
    location = /swagger.json { return 404; }
    location = /swagger-ui.html { return 404; }
    location = /openapi.json { return 404; }
    location = /api-docs { return 404; }
    location = /playground { return 404; }
    location = /config.php.bak { return 404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # === STATIC FILE CACHING ===
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Blokir dot files kecuali .well-known (untuk SSL renewal)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tixkita.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tixkita.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.tixkita.id) {
        return 301 https://$host$request_uri;
    }
    if ($host = tixkita.id) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name tixkita.id www.tixkita.id;
    return 404;
}
