name: Deploy TixKita to VPS

on:
  push:
    branches:
      - main # Akan berjalan saat ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22 
        script: |
          # Tandai folder sebagai aman agar git tidak error soal ownership
          git config --global --add safe.directory /var/www/tixkita
          
          # Pindah ke folder proyek tixkita di VPS Anda
          cd /var/www/tixkita
          
          # Tarik kode terbaru dari GitHub ke VPS
          git pull origin main
          
          # Bersihkan cache Laravel agar perubahan langsung aktif
          php artisan optimize:clear

          # Reload Nginx untuk menerapkan perubahan konfigurasi (jika ada)
          # Asumsi menggunakan Docker sesuai panduan
          docker compose exec -T nginx nginx -s reload || true
